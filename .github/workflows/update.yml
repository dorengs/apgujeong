name: 전광판 갱신

on:
  schedule:
    # 평일 오전 9시 47분, 오후 2시 47분 (한국 시간). 깃허브 시각은 UTC라서 9시간을 뺀 값입니다.
    - cron: '47 0 * * 1-5'
    - cron: '47 5 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '받는 범위: auto(평소) · 숫자(최근 몇 개월) · all(2006년부터 전부)'
        default: 'auto'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 화면 파일만 고쳐서 올린 경우(push)에는 자료를 다시 받지 않고 바로 게시합니다.
      - name: 국토부 자료 받기
        if: github.event_name != 'push'
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: node scripts/update.mjs "${{ inputs.mode || 'auto' }}"

      - name: 바뀐 자료 저장
        if: github.event_name != 'push'
        run: |
          git config user.name "전광판 자동 갱신"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw site/data.js
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다."
          else
            git commit -m "자료 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # 자동 갱신이 실패하면 저장소에 글을 남겨 주인에게 메일이 가게 합니다(이미 열린 글이 있으면 새로 만들지 않음).
      - name: 실패 알림
        if: failure() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "전광판 갱신 실패 in:title" --json number -q 'length')
          if [ "$open" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "전광판 갱신 실패 $(TZ=Asia/Seoul date '+%m월 %d일 %H:%M')" \
              --body "@${GITHUB_REPOSITORY_OWNER} 자동 갱신이 실패했습니다. 화면에는 직전 자료가 그대로 남아 있습니다. 실행 기록: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
